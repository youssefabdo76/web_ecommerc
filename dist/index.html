    <title>CROCBAG | Modern Crocs & Bags Store - WhatsApp Checkout</title>
    <meta name="description" content="Shop modern Crocs clogs, platform slides, and handcrafted tote bags for Women, Men, and Kids. Order instantly via WhatsApp." />
    
    <!-- Instant Theme Initialization Script (Prevents FOUC & Hydration Mismatch) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('crocbag_theme');
          var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && supportDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
